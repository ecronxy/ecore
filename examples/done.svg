<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-duration="3s">
  <style>
    .c { transform-box: fill-box; transform-origin: center; }
    #all   { animation: out 0.3s ease-in 2.7s both; }
    #arc   { animation: run 1.2s linear both, hide 0.2s linear 1.1s both; }
    #track { animation: hide 0.2s linear 1.1s both; }
    #disc  { animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 1.15s both; }
    #tick  { animation: draw 0.35s ease-out 1.45s both; }
    #label { animation: up 0.4s ease-out 1.6s both; }
    @keyframes run  { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -2; } }
    @keyframes hide { to { opacity: 0; } }
    @keyframes pop  { from { scale: 0; } to { scale: 1; } }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes up   { from { translate: 0 24px; opacity: 0; } to { translate: 0 0; opacity: 1; } }
    @keyframes out  { to { scale: 0.8; opacity: 0; } }
  </style>

  <g id="all" class="c">
    <!-- загрузка: дуга в четверть круга бежит по кольцу (штрих + пробел равны длине пути) -->
    <circle id="track" cx="256" cy="206" r="118" fill="none" stroke="#8E8E93" stroke-opacity="0.3" stroke-width="20"/>
    <circle id="arc" cx="256" cy="206" r="118" pathLength="1" stroke-dasharray="0.25 0.75"
            fill="none" stroke="#34C759" stroke-width="20" stroke-linecap="round"/>

    <!-- готово: круг выскакивает, галочка рисуется -->
    <circle id="disc" class="c" cx="256" cy="206" r="128" fill="#34C759"/>
    <path id="tick" d="M198 210 L240 252 L318 166" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"
          fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <text id="label" data-slot="label" data-fit="420" x="256" y="436" text-anchor="middle"
          font-family="Montserrat" font-size="68" fill="#34C759" opacity="0">готово</text>
  </g>
</svg>
